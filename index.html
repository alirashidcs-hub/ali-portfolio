    <!-- GitHub Pages SPA fallback -->
    <script>
      (function (l) {
        var params = new URLSearchParams(l.search);
        var p = params.get("p");

        if (p) {
          var q = params.get("q");

          p = p.replace(/~and~/g, "&");
          q = q ? q.replace(/~and~/g, "&") : "";

          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) +
              p +
              (q ? "?" + q : "") +
              l.hash
          );
        }
      })(window.location);
    </script>
