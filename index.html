    <script>
      // GitHub Pages SPA fallback — decodes the redirect from 404.html (if present)
      // back into a real path before React Router mounts. No-op on Vercel/Netlify.
      (function (l) {
        var params = new URLSearchParams(l.search)
        var p = params.get('p')
        if (p) {
          var q = params.get('q')
          p = p.replace(/~and~/g, '&')
          q = q ? q.replace(/~and~/g, '&') : ''
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + p + (q ? '?' + q : '') + l.hash)
        }
      })(window.location)
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
